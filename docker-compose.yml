# Local development only. Production uses Neon (prototype) or Aurora Serverless v2 (ADR-004).
services:
  db:
    image: postgres:16-alpine
    container_name: clearport-db
    environment:
      POSTGRES_USER: clearport_owner
      POSTGRES_PASSWORD: clearport_owner
      POSTGRES_DB: clearport
    ports:
      - "5544:5432"
    volumes:
      - clearport-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearport_owner -d clearport"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  clearport-db:
